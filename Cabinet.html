<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabinet</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: black;
            scroll-behavior: smooth; 
            background-repeat: no-repeat;
            background-size: cover;
            background-image: url('pictures/benefits.jpg');
            display: flex;
        }

        .container{
            min-width: 250px;
            min-height: 450px;
            max-width: 300px;
            background-image: url('/pictures/sections.png');
            background-color: rgb(58, 58, 66);
            background-repeat: no-repeat;
            background-size: cover;
            box-shadow: 0 4px 6px yellow;
            align-items: center;
            align-self: center;
            text-align: center;
            border-radius: 15px;
            margin: 10% 75px;
        }

        .container button{
            font-size: 20px;
            gap:15px;
            border-radius: 15px;
            width: 70%;
            min-height: 40px;
            margin-top: 10px;
        }

        img{
            border-radius: 100%;
            height: 150px;
            width: 150px;
        }

        label{
            text-align: left;
            font-size: 1.25rem;
        }

        input, textarea {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 95%;
            font-size: 1rem;
            background-color: #333;
        }

        .container-cp{
            width: 100%;
            min-height: 450px;
            background-color: rgb(58, 58, 66);
            box-shadow: 0 4px 6px yellow;
            align-items: center;
            align-self: center;
            text-align: center;
            border-radius: 15px;
            margin: 10% 75px;
        }

        .container-history{
            width: auto;
            height: auto;
            min-height: 350px;
            background-color: rgb(71, 71, 91);
            align-items: center;
            align-self: center;
            text-align: center;
            border-radius: 15px;
            margin: 15px 15px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 0;
        }

        nav ul {
            display: flex;
            list-style: none;
            width: 100%;
        }

        nav ul li {
            margin-top: 0;
            width: 100%;
        }

        nav ul li button{
            margin-top: 0;
            color: yellow;
            background-color: black;
            text-decoration: none;
            border: none;
            transition: 0.3s;
            width: 45%;
            font-size: 15px;
        }

        nav ul li button:hover {
            color: white;
            transform: scale((1.1));
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="profile-text">Profile</h1>
        <div id="img-profile"><img src="pictures/icon.png" alt=""></div>
        <button style="background-color: yellow;" class="btn-photoProfile">Выбрать фото</button>
        <button style="background-color: blueviolet;" class="btn-authorize">Вход</button>
        <button style="background-color: rebeccapurple;">Главная</button>
        <button style="background-color: red;">Выйти</button>
    </div>
    <div class="container-cp">
        <nav>
            <ul>
                <li>
                    <button class="btn-history">История</button>
                    <button class="btn-profile">Редактировать профиль</button>
                </li>
            </ul>
        </nav>
        <div id="changeDiv"><div class="container-history"><h1>История</h1></div></div>

            <form>
                <label for="name" style="text-align: left;">Имя (Никнейм)</label>
                <input type="text" id="name" placeholder="Введите имя">
                <label for="mail" style="text-align: left;">Почта</label>
                <input type="email" id="mail" placeholder="Введите почту">
                <label for="password"></label><input type="password" id="password" placeholder="Введите пароль">
                <button type="submit" class="btn-profileRedact" style="background-color: greenyellow; width: 70%; font-size: 20px; margin-top: 20px; min-height: 40px;">Сохранить изменения</button>
            </form>
        </div> -->
    </div>
</body>
<script src="cabinet.js"></script>
</html>
